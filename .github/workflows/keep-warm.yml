# Calls the live health check every 10 minutes, so the first child of the day does not wait for a cold start.
# The health check also runs the hourly clean-up of expired Judge Tour classes. Public repository: the minutes are free.
name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/health
        run: curl -fsS --max-time 30 https://shishya-codeforabillion.vercel.app/api/health
